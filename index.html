<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基于AI大模型的疾病诊断系统 </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #3cc1c5 0%, #ece8e9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .auth-container {
            background: white;
            border-radius: 60px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.774);
            overflow: hidden;
            max-width: 550px;
            width: 100%;
        }
        .auth-header {
            background: linear-gradient(135deg, #3b62be 0%, #5252d3 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .auth-body {
            padding: 80px;
        }
        .form-control:focus {
            border-color: #32469f;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .alert {
            border-radius: 10px;
        }
        .toggle-auth {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        .toggle-auth a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h2><i class="bi bi-heart-pulse"></i> 疾病辅助诊断系统</h2>
        </div>
        <div class="auth-body">
            <!-- 登录表单 -->
            <div id="loginForm">
                <h4 class="mb-4">用户登录</h4>
                <div id="loginAlert"></div>
                <form id="loginFormElement">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-control" id="loginUsername" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-control" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">登录</button>
                </form>
                <div class="toggle-auth">
                    没有账号？ <a href="#" onclick="showRegister(); return false;">立即注册</a>
                </div>
                
            </div>

            <!-- 注册表单 -->
            <div id="registerForm" style="display: none;">
                <h4 class="mb-4">新用户注册</h4>
                <div id="registerAlert"></div>
                <form id="registerFormElement">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-control" id="registerUsername" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">邮箱</label>
                        <input type="email" class="form-control" id="registerEmail" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-control" id="registerPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">注册</button>
                </form>
                <div class="toggle-auth">
                    已有账号？ <a href="#" onclick="showLogin(); return false;">立即登录</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:5000/api';

        function showAlert(containerId, message, type = 'danger') {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>`;
        }

        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginAlert').innerHTML = '';
            document.getElementById('registerAlert').innerHTML = '';
        }

        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('loginAlert').innerHTML = '';
            document.getElementById('registerAlert').innerHTML = '';
        }

        // 登录
        document.getElementById('loginFormElement').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    // 调试信息（可以在浏览器控制台查看）
                    console.log('登录成功，用户信息:', data.user);
                    console.log('是否管理员:', data.user.is_admin);

                    if (data.user.is_admin) {
                        console.log('跳转到管理员界面');
                        window.location.href = 'admin.html';
                    } else {
                        console.log('跳转到用户界面');
                        window.location.href = 'user.html';
                    }
                } else {
                    showAlert('loginAlert', data.error || '登录失败');
                }
            } catch (error) {
                showAlert('loginAlert', '网络错误，请检查后端服务是否启动');
            }
        });

        // 注册
        document.getElementById('registerFormElement').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            try {
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('registerAlert', '注册成功！正在跳转');
                    setTimeout(() => {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        window.location.href = 'user.html';
                    }, 1000);
                } else {
                    showAlert('registerAlert', data.error || '注册失败');
                }
            } catch (error) {
                showAlert('registerAlert', '网络错误，请检查后端服务是否启动');
            }
        });

        // 检查是否已登录
        const token = localStorage.getItem('token');
        if (token) {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (user.is_admin) {
                window.location.href = 'admin.html';
            } else {
                window.location.href = 'user.html';
            }
        }
    </script>
</body>
</html>
